services:
  flask-mvp:
    build: .
    container_name: flask-mvp
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
  postgres:
    image: postgres:16
    container_name: flask-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: flask_db
    volumes:
    - postgres_data:/var/lib/postgresq1/data

volumes:
  postgres_data:
